<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芦花家 · 更多站点</title>
    <!-- 传统 favicon（.ico 格式） -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <!-- PNG favicon（现代浏览器推荐） -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <!-- iOS 添加到主屏幕图标（苹果设备） -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <!-- Android Chrome 添加到主屏幕及 PWA 图标（通过 manifest） -->
    <link rel="manifest" href="manifest.json">

    <!-- 可选：设置主题颜色，影响部分浏览器标题栏颜色 -->
    <meta name="theme-color" content="#c75b39">
    <style>
        :root {
            --bg: #f9f7f4;
            --card-bg: #ffffff;
            --text-primary: #2c2c2c;
            --text-secondary: #6b6b6b;
            --accent: #c75b39;
            --accent-hover: #a8472b;
            --border: #e5e0d8;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.1);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Microsoft YaHei', 'Noto Sans SC', 'Noto Sans JP', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(199, 91, 57, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(199, 91, 57, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.6) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .main-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 560px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 48px 40px 40px;
            width: 100%;
            text-align: center;
            transition: box-shadow var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .main-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.02em;
            line-height: 1.3;
            margin-bottom: 8px;
            font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans', sans-serif;
        }

        .main-title .highlight {
            color: var(--accent);
            position: relative;
            white-space: nowrap;
        }

        .main-title .highlight::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            height: 6px;
            background: rgba(199, 91, 57, 0.15);
            border-radius: 3px;
            z-index: -1;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px 0 32px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            max-width: 80px;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--border));
            border-radius: 1px;
        }
        .divider::after {
            background: linear-gradient(90deg, var(--border), transparent);
        }
        .divider-icon {
            color: var(--accent);
            font-size: 1.1rem;
            letter-spacing: 4px;
            opacity: 0.7;
            user-select: none;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 28px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 24px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: #fefdfc;
            color: var(--text-primary);
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.02em;
            line-height: 1.4;
            position: relative;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover,
        .btn:focus-visible {
            border-color: var(--accent);
            background: #fffaf7;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(199, 91, 57, 0.12);
            outline: none;
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(199, 91, 57, 0.1);
            transition: all 0.1s ease;
        }

        .btn .btn-icon {
            font-size: 1.4rem;
            flex-shrink: 0;
            transition: transform var(--transition);
        }
        .btn:hover .btn-icon {
            transform: scale(1.15);
        }

        .btn .btn-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }
        .btn .btn-text .primary-text {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }
        .btn .btn-text .secondary-text {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
            line-height: 1.3;
        }

        .btn .btn-arrow {
            margin-left: auto;
            font-size: 1.2rem;
            color: var(--text-secondary);
            transition: all var(--transition);
            flex-shrink: 0;
        }
        .btn:hover .btn-arrow {
            color: var(--accent);
            transform: translateX(4px);
        }

        /* 站点按钮图标颜色微调 */
        .btn-anna .btn-icon { color: #d2691e; }
        .btn-aira .btn-icon { color: #5f9ea0; }
        .btn-siroukin .btn-icon { color: #8b4513; }
        .btn-dshcacg .btn-icon { color: #b22222; }

        /* 返回按钮 */
        .btn-back {
            border-style: dashed;
            background: #faf8f6;
        }
        .btn-back:hover,
        .btn-back:focus-visible {
            border-color: var(--accent);
            background: #fff5f0;
        }
        .btn-back .btn-icon {
            color: var(--text-secondary);
        }
        .btn-back:hover .btn-icon {
            color: var(--accent);
        }

        /* 页脚备案 */
        .page-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            z-index: 1;
            position: relative;
        }
        .page-footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color var(--transition);
            letter-spacing: 0.03em;
        }
        .page-footer a:hover {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .card {
                padding: 32px 20px 28px;
                border-radius: 14px;
            }
            .main-title {
                font-size: 1.8rem;
            }
            .btn {
                padding: 16px 18px;
                font-size: 0.95rem;
                border-radius: 10px;
            }
            .btn .btn-text .primary-text {
                font-size: 0.95rem;
            }
            .btn .btn-text .secondary-text {
                font-size: 0.72rem;
            }
            .divider {
                margin: 16px 0 24px;
            }
        }

        @media (max-width: 360px) {
            .main-title {
                font-size: 1.5rem;
            }
            .btn {
                padding: 14px 14px;
                gap: 8px;
            }
            .btn .btn-icon {
                font-size: 1.2rem;
            }
            .btn .btn-arrow {
                font-size: 1rem;
            }
        }

        /* 暗色模式适配 */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --card-bg: #242424;
                --text-primary: #ececec;
                --text-secondary: #a8a8a8;
                --accent: #e07a53;
                --accent-hover: #f08a63;
                --border: #3a3a3a;
                --shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
                --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4);
            }
            .btn {
                background: #2a2a2a;
            }
            .btn:hover,
            .btn:focus-visible {
                background: #2f2a28;
            }
            .btn .btn-text .primary-text {
                color: var(--text-primary);
            }
            .btn .btn-text .secondary-text {
                color: var(--text-secondary);
            }
            .btn-back {
                background: #2a2a2a;
            }
            .btn-back:hover {
                background: #2f2a28;
            }
            .btn-anna .btn-icon { color: #e67e22; }
            .btn-aira .btn-icon { color: #7fb3b5; }
            .btn-siroukin .btn-icon { color: #c07a4b; }
            .btn-dshcacg .btn-icon { color: #d9534f; }
            body::before {
                background:
                    radial-gradient(ellipse at 30% 20%, rgba(224, 122, 83, 0.08) 0%, transparent 50%),
                    radial-gradient(ellipse at 70% 80%, rgba(224, 122, 83, 0.05) 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <main class="card">
            <!-- 英文主标题 -->
            <h1 class="main-title">
                More <span class="highlight">roka.ink</span> Sites
            </h1>

            <!-- 装饰分隔线 -->
            <div class="divider">
                <span class="divider-icon">✦ ✦ ✦</span>

            <!-- 子站导航按钮 -->
            <div class="button-group">
                <!-- 芦花家-杏菜站 -->
                <a href="https://anna.roka.ink" class="btn btn-anna" target="_blank" rel="noopener noreferrer">

                </a>
            </div>

            <!-- 返回上一页按钮（优先使用JS返回，无JS时回退到index.html） -->
            <a href="index.html" onclick="history.back(); return false;" class="btn btn-back">
                <span class="btn-icon">↩️</span>
                <span class="btn-text">
                    <span class="primary-text">返回上一页</span>
                    <span class="secondary-text">go back</span>
                </span>
                <span class="btn-arrow">←</span>
            </a>
        </main>

        <!-- 页脚备案 -->
        <footer class="page-footer">
            <a href="https://icp.gov.moe/?keyword=20265009" target="_blank" rel="noopener noreferrer">
                萌ICP备20265009号
            </a>
        </footer>
    </div>

</body>
</html>
